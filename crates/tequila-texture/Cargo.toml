[package]
name = "tequila-texture"
description = "Texture cache, MIP pyramids, UDIM, per-map colour-space handling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
png = "0.17"
# MIT OR Apache-2.0. Pure Rust, baseline and progressive.
jpeg-decoder = "0.3"
tequila-core.workspace = true
exr = "1"
# MIT. OpenVDB reading, for Volume Maps; builds Blosc and LZ4 (BSD) from
# source through blosc-src.
vdb-rs = "0.6"
# Texture formats whose decoders are large and already written well in pure
# Rust; TGA, BMP and the DDS container are small enough to read by hand
# (`tga.rs`, `bmp.rs`, `dds.rs`). TIFF is MIT, at the version tequila-format
# writes it with; the rest are MIT OR Apache-2.0 (bcdec_rs: MIT).
tiff = "0.9"
image-webp = "0.2"
gif = "0.13"
# Block-compressed DDS (BC1 to BC7), a port of bcdec.
bcdec_rs = "0.2"
jxl-oxide = "0.12"
# SVG artwork, rasterized; usvg and tiny-skia come with it. 0.45 is the
# newest that keeps to the workspace's rust-version.
resvg = "0.45"

# A video label's frame, through the system's own decoders (`video.rs`):
# Media Foundation on Windows, AVFoundation on a Mac. Versions the workspace
# already brings.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
# Only so the decoder can be tested against pixels this crate chose, rather
# than against a checked-in blob nobody can see the contents of. Its licence is
# (MIT OR Apache-2.0) AND IJG; as a dev-dependency it is not part of anything
# distributed, so it raises no NOTICE obligation.
jpeg-encoder = "0.6"
# The same, for JPEG XL: a lossless encoder, so the decoder is tested
# against pixels written here. MIT OR Apache-2.0 OR Zlib.
zune-jpegxl = "0.5"
zune-core = "0.5"
