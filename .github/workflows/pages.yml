name: Website

# Publishes website/ to GitHub Pages (https://ifpintac.github.io/tequila/)
# whenever it changes on main. The site is plain HTML, CSS and JavaScript,
# so there is nothing to build: the folder is uploaded as it is. Pages must
# be set to deploy from GitHub Actions (Settings > Pages > Source).
#
# Run it by hand (Actions > Website > Run workflow) to publish again
# without a change.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and a newer one never cancels one already going.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
